# ==============================================================================
# Nginx Configuration for jusctrabalho.tccodes.com.br
# ==============================================================================

upstream jusc_backend {
    server app:3001;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS and handle Let's Encrypt renewal
server {
    listen 80;
    listen [::]:80;
    server_name jusctrabalho.tccodes.com.br;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect to HTTPS if SSL certificates exist
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jusctrabalho.tccodes.com.br;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/jusctrabalho.tccodes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jusctrabalho.tccodes.com.br/privkey.pem;

    # Modern SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    client_max_body_size 25M;

    # Backend API and Static proxy
    location / {
        proxy_pass http://jusc_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
