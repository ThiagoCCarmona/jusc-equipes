services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jusc_trabalho
    restart: unless-stopped
    networks:
      - proxy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/jusc.db
      - DOMAIN=jusctrabalho.tccodes.com.br
    volumes:
      # Persistent SQLite database volume
      - ./data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jusc-trabalho.rule=Host(`jusctrabalho.tccodes.com.br`)"
      - "traefik.http.routers.jusc-trabalho.entrypoints=websecure"
      - "traefik.http.routers.jusc-trabalho.tls.certresolver=myresolver"
      - "traefik.http.services.jusc-trabalho.loadbalancer.server.port=3001"

networks:
  proxy:
    external: true
