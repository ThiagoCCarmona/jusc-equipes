name: Build & Test CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Build Frontend
      run: npm run build

    - name: Install Backend Dependencies
      run: |
        cd server
        npm ci

    - name: Build Backend
      run: |
        cd server
        npm run build

    - name: Test Docker Build
      run: |
        docker build -t jusc-app:test .
